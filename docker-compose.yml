services:
  postgres-db:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
      POSTGRES_DB: ecommerce
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-database-init:
    image: postgres:18.6-alpine3.23
    environment:
      PGHOST: postgres-db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
    command:
      - sh
      - -ec
      - |
        if [ "$$(psql --dbname postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'ecommerce_payment'")" != "1" ]; then
          createdb --template template0 ecommerce_payment
        fi
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ecommerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Create .env from .env.example and set RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - default
      - local-access
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.9-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data --debug /data/debug.log
    ports:
      - "127.0.0.1:${AZURITE_PORT:-10000}:10000"
    networks:
      - default
      - local-access
    restart: unless-stopped
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - default
      - local-access
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 10

  ecommerce-payment:
    image: ${ECOMMERCE_PAYMENT_IMAGE:-ecommerce-payment:local}
    build:
      context: ${ECOMMERCE_PAYMENT_CONTEXT:-../../../personal-projects/ECommercePayment}
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: postgres-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ecommerce_payment
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
      WEBHOOK_SECRET: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:?Create .env from .env.example and set PAYMENT_GATEWAY_WEBHOOK_SECRET}
      WEBHOOK_TIMEOUT_SECONDS: 5
      ALLOWED_CALLBACK_ORIGINS: http://ecommerce-api:8080
    ports:
      - "127.0.0.1:${PAYMENT_GATEWAY_PORT:-5002}:5000"
    networks:
      - default
      - local-access
    depends_on:
      payment-database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ecommerce-api:  
    image: ${ECOMMERCE_API_IMAGE:-ecommerce-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres-db;Port=5432;Database=ecommerce;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Create .env from .env.example and set JWT_SECRET_KEY}
      DatabaseInitialization__ApplyMigrationsOnStartup: "true"
      DatabaseSeed__Enabled: ${DATABASE_SEED_ENABLED:-true}
      DatabaseSeed__SeedSampleCatalog: ${SEED_SAMPLE_CATALOG:-true}
      DatabaseSeed__AdministratorEmail: ${SEED_ADMIN_EMAIL:-}
      DatabaseSeed__AdministratorPassword: ${SEED_ADMIN_PASSWORD:-}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-ecommerce}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Create .env from .env.example and set RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: /
      RabbitMq__ExchangeName: ecommerce.events
      Redis__Configuration: redis:6379,abortConnect=false,connectTimeout=1000
      ProductImageStorage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      ProductImageStorage__PublicBaseUrl: http://localhost:10000/devstoreaccount1/product-images
      Email__Host: mailpit
      Email__Port: 1025
      Email__PublicAppBaseUrl: ${FRONTEND_ORIGIN:-http://localhost:3000}
      PaymentGateway__BaseUrl: http://ecommerce-payment:5000
      PaymentGateway__CallbackUrl: http://ecommerce-api:8080/api/webhooks/payments
      PaymentGateway__WebhookSecret: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:?Create .env from .env.example and set PAYMENT_GATEWAY_WEBHOOK_SECRET}
      PaymentGateway__TimeoutSeconds: 10
      ApiProtection__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
      ApiProtection__UseHttpsRedirection: "false"
    ports:
      - "127.0.0.1:${ECOMMERCE_API_PORT:-8080}:8080"
    networks:
      - default
      - local-access
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      ecommerce-payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  ecommerce-worker:
    image: ${ECOMMERCE_WORKER_IMAGE:-ecommerce-worker:local}
    build:
      context: ${ECOMMERCE_WORKER_CONTEXT:-../../../personal-projects/ECommerceWorker}
      dockerfile: Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__WorkerDatabase: Host=postgres-db;Port=5432;Database=ecommerce;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
      WorkerRuntime__ShutdownDrainSeconds: 30
      WorkerRuntime__ConsumerConcurrency: 1
      WorkerRuntime__DatabasePoolSize: 32
      WorkerRuntime__DatabaseCommandTimeoutSeconds: 30
      WorkerRuntime__RabbitMqConnectionTimeoutSeconds: 10
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER:-ecommerce}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Create .env from .env.example and set RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: /
      RabbitMq__ExchangeName: ecommerce.events
      RabbitMq__RetryExchangeName: ecommerce.events.retry
      RabbitMq__RetryQueueName: ecommerce.worker.orders.retry
      RabbitMq__MaximumRetryAttempts: 3
      RabbitMq__RetryDelaySeconds: 15
      Email__Enabled: "true"
      Email__Host: mailpit
      Email__Port: 1025
      Email__UseSsl: "false"
      Email__TimeoutSeconds: 15
      ApiOutboxPublisher__Enabled: "true"
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      ecommerce-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - default
      - local-access
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/worker-alerts.yml:/etc/prometheus/worker-alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      ecommerce-api:
        condition: service_healthy
      ecommerce-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Create .env from .env.example and set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - default
      - local-access
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s
    restart: unless-stopped

networks:
  default:
    internal: true
  local-access:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  azurite-data:
  prometheus-data:
  grafana-data:
