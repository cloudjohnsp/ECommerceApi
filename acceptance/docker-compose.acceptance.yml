services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: acceptance-password
      POSTGRES_DB: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceptance -d ecommerce"]
      interval: 2s
      timeout: 3s
      retries: 20

  payment-database-init:
    image: postgres:18.6-alpine3.23
    environment:
      PGHOST: postgres
      PGUSER: acceptance
      PGPASSWORD: acceptance-password
    command:
      - sh
      - -ec
      - |
        if [ "$$(psql --dbname postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'ecommerce_payment'")" != "1" ]; then
          createdb --template template0 ecommerce_payment
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: acceptance
      RABBITMQ_DEFAULT_PASS: acceptance-password
    ports:
      - "127.0.0.1::5672"
    networks:
      - default
      - host-access
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  payment:
    image: ecommerce-acceptance-payment:local
    build:
      context: ${ECOMMERCE_PAYMENT_CONTEXT:-../../../../personal-projects/ECommercePayment}
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ecommerce_payment
      DATABASE_USER: acceptance
      DATABASE_PASSWORD: acceptance-password
      WEBHOOK_SECRET: acceptance-webhook-secret-at-least-32-bytes
      WEBHOOK_TIMEOUT_SECONDS: 5
      ALLOWED_CALLBACK_ORIGINS: http://api:8080
    ports:
      - "127.0.0.1::5000"
    networks:
      - default
      - host-access
    depends_on:
      payment-database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ecommerce-acceptance-api:local
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ecommerce;Username=acceptance;Password=acceptance-password
      DatabaseInitialization__ApplyMigrationsOnStartup: "true"
      DatabaseSeed__Enabled: "true"
      DatabaseSeed__SeedSampleCatalog: "false"
      DatabaseSeed__AdministratorEmail: acceptance-admin@example.test
      DatabaseSeed__AdministratorPassword: Acceptance!23456
      Jwt__SecretKey: acceptance-jwt-secret-key-at-least-32-bytes
      Redis__Enabled: "false"
      ProductImageStorage__Enabled: "false"
      Email__Enabled: "false"
      PaymentGateway__BaseUrl: http://payment:5000
      PaymentGateway__CallbackUrl: http://api:8080/api/webhooks/payments
      PaymentGateway__WebhookSecret: acceptance-webhook-secret-at-least-32-bytes
      PaymentGateway__TimeoutSeconds: 10
      OutboxProcessor__Enabled: "true"
      OutboxProcessor__PublishIntegrationEvents: "false"
      OutboxProcessor__CronExpression: "* * * * *"
      OrderExpiration__Enabled: "true"
      OrderExpiration__PaymentLifetimeMinutes: 10
      OrderExpiration__CronExpression: "* * * * *"
      ApiProtection__GlobalPermitLimit: 10000
      ApiProtection__AuthenticationPermitLimit: 1000
      ApiProtection__UseHttpsRedirection: "false"
    ports:
      - "127.0.0.1::8080"
    networks:
      - default
      - host-access
    depends_on:
      postgres:
        condition: service_healthy
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s

  worker:
    image: ecommerce-acceptance-worker:local
    build:
      context: ${ECOMMERCE_WORKER_CONTEXT:-../../../../personal-projects/ECommerceWorker}
      dockerfile: Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__WorkerDatabase: Host=postgres;Port=5432;Database=ecommerce;Username=acceptance;Password=acceptance-password
      WorkerRuntime__ShutdownDrainSeconds: 5
      WorkerRuntime__ConsumerConcurrency: 1
      WorkerRuntime__DatabasePoolSize: 16
      WorkerRuntime__DatabaseCommandTimeoutSeconds: 10
      WorkerRuntime__RabbitMqConnectionTimeoutSeconds: 5
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: acceptance
      RabbitMq__Password: acceptance-password
      RabbitMq__VirtualHost: /
      RabbitMq__ExchangeName: ecommerce.events
      RabbitMq__RetryExchangeName: ecommerce.events.retry
      RabbitMq__RetryQueueName: ecommerce.worker.orders.retry
      RabbitMq__MaximumRetryAttempts: 2
      RabbitMq__RetryDelaySeconds: 1
      Email__Enabled: "false"
      ApiOutboxPublisher__Enabled: "true"
      ApiOutboxPublisher__BatchSize: 10
      ApiOutboxPublisher__PollIntervalSeconds: 1
      ApiOutboxPublisher__LockSeconds: 5
      ApiOutboxPublisher__MaximumAttempts: 4
      ApiOutboxPublisher__BaseRetryDelaySeconds: 1
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

networks:
  default:
    internal: true
  host-access:
    driver: bridge
