global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/worker-alerts.yml

scrape_configs:
  - job_name: ecommerce-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - ecommerce-api:8080

  - job_name: ecommerce-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - ecommerce-worker:8080
