name: Coordinated integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinated-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-known-revisions:
    name: Validate API, Worker and Payment
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout API
        uses: actions/checkout@v7
        with:
          path: ECommerceApi

      - name: Resolve locked repositories
        id: revisions
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("ECommerceApi/integration/revisions.json", encoding="utf-8") as source:
              lock = json.load(source)
          print(f"worker_repository={lock['worker']['repository']}")
          print(f"worker_revision={lock['worker']['revision']}")
          print(f"payment_repository={lock['payment']['repository']}")
          print(f"payment_revision={lock['payment']['revision']}")
          PY

      - name: Checkout Worker at locked revision
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.revisions.outputs.worker_repository }}
          ref: ${{ steps.revisions.outputs.worker_revision }}
          path: ECommerceWorker

      - name: Checkout Payment at locked revision
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.revisions.outputs.payment_repository }}
          ref: ${{ steps.revisions.outputs.payment_revision }}
          path: ECommercePayment

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ECommercePayment/requirements.txt
            ECommercePayment/requirements-dev.txt

      - name: Run coordinated local-equivalent gate
        shell: bash
        run: |
          bash ./ECommerceApi/scripts/verify-multi-repository.sh \
            --worker-path "$GITHUB_WORKSPACE/ECommerceWorker" \
            --payment-path "$GITHUB_WORKSPACE/ECommercePayment"

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coordinated-integration-${{ github.sha }}
          path: ECommerceApi/TestResults/coordinated
          if-no-files-found: ignore
          retention-days: 7
