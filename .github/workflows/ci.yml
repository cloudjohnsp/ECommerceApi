name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ECommerceApi.slnx

      - name: Verify formatting
        run: dotnet format ECommerceApi.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ECommerceApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ECommerceApi.slnx --configuration Release --no-build --no-restore
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: true

      - name: Enforce unit test coverage
        shell: pwsh
        run: ./scripts/verify-unit-coverage.ps1 -Configuration Release

  container:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ecommerce-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: ecommerce-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
